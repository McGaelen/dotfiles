[nightlight]
enabled = true
force = true
temperature_night = 4600

[notification]
background_opacity = 0.69999998435378075
layer = "overlay"

[osd.kinds]
keyboard_layout = false
lock_keys = false
media = false
privacy = false

[plugins]
enabled = [ "mcgaelen/better-control-center", "mcgaelen/niri-taskbar-minimap" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "~/.config/noctalia/my-plugins"
    name = "my-plugins"

[shell]
clipboard_enabled = false
clipboard_keep_from_closed_apps = false
font_family = "Adwaita Sans"
polkit_agent = true

    [shell.animation]
    speed = 3.0000000447034836

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    transparency_mode = "soft"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    label = "Sleep"
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "destructive"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "niri", "qt" ]
    community_ids = [ "vicinae" ]

[wallpaper]
directory = "/usr/share/wallpapers"

    [wallpaper.default]
    path = "/usr/share/wallpapers/cachyos-wallpapers/Dimensions.png"

    [wallpaper.last]
    path = "/usr/share/wallpapers/cachyos-wallpapers/Dimensions.png"

    [wallpaper.monitors.DP-1]
    path = "/usr/share/wallpapers/cachyos-wallpapers/Dimensions.png"

    [wallpaper.monitors.DP-2]
    path = "/usr/share/wallpapers/cachyos-wallpapers/Dimensions.png"

[widget.Vicinae]
glyph = "apps-filled"
tooltip = "Launcher"
type = "custom_button"

    [widget.Vicinae.actions]
    left = "exec vicinae open"

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%l:%M %p}"

[widget.control-center]
glyph = "settings-filled"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.niri-taskbar-minimap]
focused_background = "primary"
focused_text = "on_primary"
inactive_background = "surface_variant"
inactive_text = "secondary"
max_width = 875
type = "mcgaelen/niri-taskbar-minimap:niri-taskbar-minimap"

[widget.privacy]
hide_inactive = true
inactive_color = "on_primary"

[widget.session]
color = "error"

[widget.taskbar]
capsule_border = "primary"
capsule_padding = 19
capsule_radius = "auto"
enabled = false
icon_scale = 1.5
show_window_title = true
window_title_max_width = 150

[widget.tray]
drawer = true

[widget.volume]
show_label = false