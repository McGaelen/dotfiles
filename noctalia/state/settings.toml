config_version = 14

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.53999998793005943
    center = [ "niri-taskbar-minimap" ]
    end = [ "tray", "notifications", "control-center", "battery", "clock", "session" ]
    font_family = "Adwaita Sans"
    font_weight = 700
    margin_ends = 0
    padding = 10
    panel_overlap = 0
    position = "bottom"
    radius = 14
    radius_bottom_left = 0
    radius_bottom_right = 0
    shadow = false
    start = [ "Vicinae", "workspaces", "privacy" ]
    thickness = 30
    widget_spacing = 14

        [bar.default.monitor.DP-2]

[brightness]
enable_ddcutil = true

[calendar]

[control_center]
hidden_tabs = [ "media", "system", "power", "weather", "calendar", "notifications", "screen-time" ]
sidebar = "full"
sidebar_section = "none"
width = 780

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "system"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

