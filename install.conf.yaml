- defaults:
    link:
      create: true
      backup: true

- clean: ['~']

- clean: ['~/bin']
- link:  { ~/bin: bin }

- clean:
    - ~/.config/fish/completions
    - ~/.config/fish/config.fish
- link:
    ~/.config/fish/completions: fish/completions
    ~/.config/fish/config.fish: fish/config.fish

- clean: ['~/.config/niri']
- link:  { ~/.config/niri: niri }

- clean:
    - ~/.config/noctalia
    - ~/.local/state/noctalia
- link:
    ~/.config/noctalia: noctalia/config
    ~/.local/state/noctalia/settings.toml: noctalia/state/settings.toml

- clean: ['~/.config/ghostty']
- link:  { ~/.config/ghostty: ghostty }

- clean: ['~/.config/vicinae']
- link:  { ~/.config/vicinae: vicinae }

- clean:
    - ~/.config/VSCodium/User/settings.json
    - ~/.config/VSCodium/User/keybindings.json
- link:
    ~/.config/VSCodium/User/settings.json: VSCodium/settings.json
    ~/.config/VSCodium/User/keybindings.json: VSCodium/keybindings.json

- clean: ['~/.config/zed']
- link:  { ~/.config/zed: zed }

# - shell:
  # - [git submodule update --init --recursive, Installing submodules]
